# Repo-root config only — run Streamlit from the repo root, e.g.:
#   streamlit run frontend/app.py
# A single [theme] section (no [theme.dark]) locks the app to light mode.

[theme]
base = "light"
primaryColor = "#e87511"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f7f8"
textColor = "#131516"
linkColor = "#e87511"
borderColor = "#e3e6e8"
baseRadius = "8px"

[client]
# Hide the app menu (and its Light/Dark/System theme picker) for all viewers.
toolbarMode = "minimal"